<!DOCTYPE html>
<html>

<head>
    <title>EpokSMP - Map</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">


    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom markers -->
    <script type="text/javascript" src="custom.markers.js"></script>

    <!-- uNmINeD JS and CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">
        
    </style>

</head>

<body>
    <div id="top-label">Last Updated: 2026/04/28</div>
    <div id="side-label">EpokMaps ©Everest Corp</div>
    <div id="map"></div>

    <div id="search-container">
    <input type="text" id="marker-search" placeholder="Search location..." />
    </div>

    <div id="search-results"></div>

    <script type="text/javascript">

document.title = UnminedMapProperties.worldName + " - " + document.title;

if (UnminedCustomMarkers && UnminedCustomMarkers.isEnabled && UnminedCustomMarkers.markers) {
    UnminedMapProperties.markers = UnminedMapProperties.markers || [];
    UnminedMapProperties.markers = UnminedMapProperties.markers.concat(UnminedCustomMarkers.markers);
}

if (UnminedPlayers && UnminedPlayers.length > 0) {
    UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
}

const mapElement = document.getElementById('map');
const unmined = new Unmined(mapElement, UnminedMapProperties, UnminedRegions);

const searchInput = document.getElementById("marker-search");
const resultsBox = document.getElementById("search-results");

// Combine all markers
function getAllMarkers() {
    let markers = [];

    if (UnminedMapProperties.markers) {
        markers = markers.concat(UnminedMapProperties.markers);
    }

    if (UnminedMapProperties.playerMarkers) {
        markers = markers.concat(UnminedMapProperties.playerMarkers);
    }

    return markers;
}

// 🔍 ENTER SEARCH (smooth zoom + pan)
searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        const query = searchInput.value.toLowerCase().trim();
        if (!query) return;

        const markers = getAllMarkers();

        const found = markers.find(m => 
            m.text && m.text.toLowerCase().includes(query)
        );

        if (found) {
            const view = unmined.olMap.getView();

            const target = ol.proj.transform(
                [found.x, found.z],
                unmined.dataProjection,
                unmined.viewProjection
            );

            const currentZoom = view.getZoom();
            const targetZoom = Math.min(currentZoom + 2, view.getMaxZoom());

            view.animate(
                {
                    center: target,
                    duration: 800,
                    easing: ol.easing.easeOut
                },
                {
                    zoom: targetZoom,
                    duration: 600,
                    easing: ol.easing.easeOut
                }
            );

        } else {
            Toastify({
                text: "Location not found",
                duration: 2000,
                gravity: "top",
                position: "center",
            }).showToast();
        }
    }
});

// 📦 SHOW DROPDOWN ON FOCUS
searchInput.addEventListener("focus", () => {
    setTimeout(() => {
        resultsBox.style.display = "block";
        updateResults(searchInput.value.toLowerCase().trim());
    }, 50);
});

// ❌ HIDE DROPDOWN WHEN CLICKING OUTSIDE
document.addEventListener("click", (e) => {
    const container = document.getElementById("search-container");

    if (!container.contains(e.target)) {
        resultsBox.style.display = "none";
    }
});

// ⌨️ LIVE SEARCH
searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase().trim();
    updateResults(query);
});

// 🔄 UPDATE RESULTS
function updateResults(query) {
    const markers = getAllMarkers();

    let filtered = markers.filter(m => m.text);

    if (query) {
        filtered = filtered.filter(m =>
            m.text.toLowerCase().includes(query)
        );
    }

    // Sort by relevance
    filtered.sort((a, b) => {
        return a.text.toLowerCase().indexOf(query) - b.text.toLowerCase().indexOf(query);
    });

    filtered = filtered.slice(0, 10);

    resultsBox.innerHTML = "";

    filtered.forEach(marker => {
        const div = document.createElement("div");
        div.className = "search-item";
        div.textContent = marker.text;

        div.addEventListener("click", () => {
            searchInput.value = marker.text;
            resultsBox.style.display = "none";

            // trigger enter search
            const event = new KeyboardEvent("keydown", { key: "Enter" });
            searchInput.dispatchEvent(event);
        });

        resultsBox.appendChild(div);
    });
}

</script>
</body>

</html>
