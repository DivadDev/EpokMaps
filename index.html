<!DOCTYPE html>
<html>

<head>
    <title>EpokSMP - Map</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script src="lib/toastify-js.js"></script>
    <link rel="stylesheet" href="lib/toastify-js.min.css">

    <!-- Map metadata -->
    <script src="unmined.map.properties.js"></script>
    <script src="unmined.map.regions.js"></script>
    <script src="unmined.map.players.js"></script>

    <!-- Custom markers -->
    <script src="custom.markers.js"></script>

    <!-- Map engine -->
    <script src="unmined.js"></script>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div id="top-label">Last Updated: 2026/05/05</div>
<div id="side-label">EpokMaps ©Everest Corp</div>
<div id="map"></div>

<!-- ✅ SEARCH UI -->
<div id="search-container">
    <div id="search-results"></div>
    <input type="text" id="marker-search" placeholder="Search location..." />
</div>

<script>
document.title = UnminedMapProperties.worldName + " - " + document.title;

// Merge markers
if (UnminedCustomMarkers?.isEnabled) {
    UnminedMapProperties.markers = [
        ...(UnminedMapProperties.markers || []),
        ...UnminedCustomMarkers.markers
    ];
}

if (UnminedPlayers?.length > 0) {
    UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
}

// Init map
const unmined = new Unmined(
    document.getElementById('map'),
    UnminedMapProperties,
    UnminedRegions
);

const searchInput = document.getElementById("marker-search");
const resultsBox = document.getElementById("search-results");

// Get all markers
function getAllMarkers() {
    return [
        ...(UnminedMapProperties.markers || []),
        ...(UnminedMapProperties.playerMarkers || [])
    ];
}

// 🔍 ENTER SEARCH (smooth animation)
searchInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;

    const query = searchInput.value.toLowerCase().trim();
    if (!query) return;

    const found = getAllMarkers().find(m =>
        m.text?.toLowerCase().includes(query)
    );

    if (!found) {
        Toastify({
            text: "Location not found",
            duration: 2000,
            gravity: "top",
            position: "center"
        }).showToast();
        return;
    }

    const view = unmined.olMap.getView();

    const target = ol.proj.transform(
        [found.x, found.z],
        unmined.dataProjection,
        unmined.viewProjection
    );

    const targetZoom = Math.min(view.getZoom() + 2, view.getMaxZoom());

    view.animate(
        { center: target, duration: 800 },
        { zoom: targetZoom, duration: 600 }
    );
});

// 📦 SHOW DROPDOWN
searchInput.addEventListener("focus", () => {
    resultsBox.style.display = "block";
    updateResults(searchInput.value.toLowerCase());
});

// ❌ HIDE DROPDOWN
document.addEventListener("click", (e) => {
    if (!document.getElementById("search-container").contains(e.target)) {
        resultsBox.style.display = "none";
    }
});

// ⌨️ LIVE SEARCH
searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase().trim();
    resultsBox.style.display = "block";
    updateResults(query);
});

// 🔄 UPDATE RESULTS
function updateResults(query) {
    const markers = getAllMarkers().filter(m => m.text);

    let filtered = markers;

    if (query) {
        filtered = markers.filter(m =>
            m.text.toLowerCase().includes(query)
        );
    }

    // Sort relevance
    filtered.sort((a, b) =>
        a.text.toLowerCase().indexOf(query) -
        b.text.toLowerCase().indexOf(query)
    );

    filtered = filtered.slice(0, 10);

    resultsBox.innerHTML = "";

    if (filtered.length === 0) {
        resultsBox.innerHTML = "<div class='search-item'>No results</div>";
        return;
    }

    filtered.forEach(marker => {
        const div = document.createElement("div");
        div.className = "search-item";
        div.textContent = marker.text;

        div.onclick = () => {
            searchInput.value = marker.text;
            resultsBox.style.display = "none";

            searchInput.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }));
        };

        resultsBox.appendChild(div);
    });
}
</script>

</body>
</html>
